<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMate AI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">

        <div class="header">
            <h1>EduMate AI</h1>
            <p>Asisten Belajar Mahasiswa berbasis Gemini AI</p>
        </div>

        <div class="chat-box" id="chat-box">

            <div class="message bot">
                Halo 👋 Saya EduMate AI. Ada yang ingin dipelajari hari ini?
            </div>

        </div>

        <form id="chat-form" class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Tanyakan sesuatu..."
                autocomplete="off"
            >

            <button type="submit">
                Kirim
            </button>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
